  provider_check_ref:
    m365: exo:Get-HostedOutboundSpamFilterPolicy
  framework_mappings:
    soc2: [CC7.2]
    nist: [IR-4]
    iso27001: [A.8.7]
- code: CIS-M365-2.1.7
  name: Anti-phishing policy with mailbox intelligence is enabled
  description: An anti-phishing policy with mailbox intelligence should protect against impersonation
    and spoofing attacks
  severity: high
  framework: cis-m365
  effort: quick
  exposure: internet
  remediation_group: m365_defender_email_policies
  remediation_action: Enable an anti-phishing policy with mailbox intelligence for all recipients
  remediation_hint: 'Defender portal > Policies & rules > Threat policies > Anti-phishing'
  provider_check_ref:
    m365: exo:Get-AntiPhishPolicy
  framework_mappings:
    soc2: [CC6.8]
    nist: [SI-3, SI-8]
    iso27001: [A.8.7]
- code: CIS-M365-2.1.9
  name: DKIM is enabled for all Exchange Online domains
  description: DKIM signing should be enabled for every accepted domain so recipients can verify message
    integrity and origin
  severity: medium
  framework: cis-m365
  effort: moderate
  exposure: internet
  remediation_group: m365_email_authentication
