    m365: exo:Get-HostedConnectionFilterPolicy(IPAllowList)
  framework_mappings:
    soc2: [CC6.8]
    nist: [SI-8]
    iso27001: [A.8.7]
- code: CIS-M365-2.1.12
  name: Anti-spam policies do not whitelist sender domains
  description: Allowed sender domain lists bypass spam and phishing filtering for entire domains and
    are a common phishing bypass
  severity: high
  framework: cis-m365
  effort: quick
  exposure: internet
  remediation_group: m365_defender_email_policies
  remediation_action: Remove allowed sender domains from anti-spam policies
  remediation_hint: 'Set-HostedContentFilterPolicy -Identity Default -AllowedSenderDomains @{}'
  provider_check_ref:
