# ── §5 Microsoft Entra admin center ───────────────────────────────────
- code: CIS-M365-5.1.1.1
  name: Security defaults or Conditional Access protect the tenant
  description: The tenant must have baseline identity protection - either security defaults or a set
    of enabled Conditional Access policies
  severity: high
  framework: cis-m365
  effort: quick
  exposure: internet
  remediation_group: m365_conditional_access
  remediation_action: Enable security defaults, or deploy Conditional Access policies covering MFA and
    legacy authentication
  remediation_hint: 'Entra admin center > Overview > Properties > Manage security defaults'
  provider_check_ref:
    m365: graph:/policies/identitySecurityDefaultsEnforcementPolicy
  framework_mappings:
    soc2: [CC6.1, CC6.2]
    nist: [IA-2, AC-3]
    iso27001: [A.8.5, A.5.15]
- code: CIS-M365-5.1.2.1
  name: Users cannot register applications
  description: Regular users should not be able to register applications in the tenant, which can be
    abused for illicit consent and persistence
  severity: medium
  framework: cis-m365
  effort: quick
  exposure: internal
  remediation_group: m365_user_defaults
  remediation_action: Disable app registration for non-admin users
  remediation_hint: 'Entra admin center > Users > User settings > App registrations: No'
  provider_check_ref:
    m365: graph:/policies/authorizationPolicy(allowedToCreateApps)
  framework_mappings:
    soc2: [CC6.1]
    nist: [CM-7, AC-6]
    iso27001: [A.5.15]
- code: CIS-M365-5.1.2.2
  name: Users cannot create tenants
  description: Regular users should not be able to create new Entra tenants, which escape all organizational
    security controls
  severity: medium
  framework: cis-m365
  effort: quick
  exposure: internal
  remediation_group: m365_user_defaults
  remediation_action: Restrict tenant creation to administrators
  remediation_hint: 'Entra admin center > Users > User settings > Restrict non-admin users from creating
    tenants: Yes'
  provider_check_ref:
    m365: graph:/policies/authorizationPolicy(allowedToCreateTenants)
  framework_mappings:
    soc2: [CC6.1]
    nist: [CM-7, AC-6]
    iso27001: [A.5.15]
- code: CIS-M365-5.1.2.3
  name: Users cannot create security groups
  description: Security group creation should be restricted to administrators to keep access management
    centrally controlled
  severity: low
  framework: cis-m365
  effort: quick
  exposure: internal
  remediation_group: m365_user_defaults
  remediation_action: Restrict security group creation to administrators
  remediation_hint: 'Entra admin center > Groups > General > Users can create security groups: No'
  provider_check_ref:
    m365: graph:/policies/authorizationPolicy(allowedToCreateSecurityGroups)
  framework_mappings:
    soc2: [CC6.1]
    nist: [AC-2, AC-6]
    iso27001: [A.5.15]
- code: CIS-M365-5.1.5.1
  name: User consent to applications is restricted
  description: Users should not be able to consent to third-party application permission requests, or
    only to low-impact permissions from verified publishers
  severity: high
  framework: cis-m365
  effort: quick
  exposure: internet
  remediation_group: m365_user_defaults
  remediation_action: Disable user consent to apps, or limit it to verified publishers requesting low-impact
    permissions
  remediation_hint: 'Entra admin center > Enterprise applications > Consent and permissions > User consent
    settings'
  provider_check_ref:
    m365: graph:/policies/authorizationPolicy(permissionGrantPoliciesAssigned)
  framework_mappings:
    soc2: [CC6.1]
    nist: [CM-7, AC-6]
    iso27001: [A.5.15]
- code: CIS-M365-5.1.6.1
  name: Guest invitations are restricted
  description: Only administrators and users in the guest-inviter role should be able to invite guests
    into the tenant
  severity: medium
  framework: cis-m365
  effort: quick
  exposure: internet
  remediation_group: m365_guest_access
  remediation_action: Restrict guest invitations to admins and guest-inviter roles
  remediation_hint: 'Entra admin center > External identities > External collaboration settings > Guest
    invite settings'
  provider_check_ref:
    m365: graph:/policies/authorizationPolicy(allowInvitesFrom)
  framework_mappings:
    soc2: [CC6.1, CC6.3]
    nist: [AC-2, AC-3]
    iso27001: [A.5.15, A.5.19]
- code: CIS-M365-5.1.6.2
  name: Guest user access is restricted
  description: Guest users should have the most restricted directory role so they cannot enumerate users,
    groups, or other directory objects
  severity: medium
  framework: cis-m365
  effort: quick
  exposure: internet
  remediation_group: m365_guest_access
  remediation_action: Set guest user access to the most restricted level
  remediation_hint: 'Entra admin center > External identities > External collaboration settings > Guest
    user access: most restricted'
  provider_check_ref:
    m365: graph:/policies/authorizationPolicy(guestUserRoleId)
  framework_mappings:
    soc2: [CC6.1, CC6.3]
    nist: [AC-3, AC-6]
    iso27001: [A.5.15, A.5.19]
- code: CIS-M365-5.1.3.1
  name: Password expiration is disabled
  description: Passwords should be set to never expire per modern NIST and Microsoft guidance - forced
    rotation encourages weaker passwords
  severity: low
  framework: cis-m365
  effort: quick
  exposure: internal
  remediation_group: m365_password_policy
  remediation_action: Set password validity to never expire on all verified domains
  remediation_hint: 'Update-MgDomain or Microsoft 365 admin center > Settings > Org settings > Security
    & privacy > Password expiration policy'
  provider_check_ref:
    m365: graph:/domains(passwordValidityPeriodInDays)
  framework_mappings:
    soc2: [CC6.1]
    nist: [IA-5]
    iso27001: [A.5.17]
- code: CIS-M365-5.2.2.1
  name: MFA is enforced for administrative roles
  description: A Conditional Access policy (or security defaults) must require multi-factor authentication
    for all administrative directory roles
  severity: high
  framework: cis-m365
  effort: moderate
  exposure: internet
  remediation_group: m365_conditional_access
  remediation_action: Create a Conditional Access policy requiring MFA for all directory roles
  remediation_hint: 'Entra admin center > Protection > Conditional Access: policy targeting directory
    roles with Require MFA grant'
  provider_check_ref:
    m365: graph:/identity/conditionalAccess/policies
  framework_mappings:
    soc2: [CC6.1, CC6.2]
    nist: [IA-2(1)]
    iso27001: [A.8.5, A.5.17]
- code: CIS-M365-5.2.2.2
  name: MFA is enforced for all users
  description: A Conditional Access policy (or security defaults) must require multi-factor authentication
    for all users
  severity: high
  framework: cis-m365
  effort: moderate
  exposure: internet
  remediation_group: m365_conditional_access
  remediation_action: Create a Conditional Access policy requiring MFA for all users
  remediation_hint: 'Entra admin center > Protection > Conditional Access: policy targeting all users
    with Require MFA grant'
  provider_check_ref:
    m365: graph:/identity/conditionalAccess/policies
  framework_mappings:
    soc2: [CC6.1, CC6.2]
    nist: [IA-2(2)]
    iso27001: [A.8.5, A.5.17]
- code: CIS-M365-5.2.2.3
  name: Legacy authentication is blocked
  description: Legacy authentication protocols (POP, IMAP, SMTP AUTH, ActiveSync basic auth) bypass MFA
    and must be blocked via Conditional Access or security defaults
  severity: high
  framework: cis-m365
  effort: moderate
  exposure: internet
  remediation_group: m365_conditional_access
  remediation_action: Create a Conditional Access policy blocking legacy authentication clients
  remediation_hint: 'Entra admin center > Protection > Conditional Access: policy on client apps Exchange
    ActiveSync + Other clients with Block grant'
  provider_check_ref:
    m365: graph:/identity/conditionalAccess/policies
  framework_mappings:
    soc2: [CC6.1, CC6.6]
    nist: [IA-2, AC-17]
    iso27001: [A.8.5, A.8.20]
- code: CIS-M365-5.2.3.1
  name: All administrators have registered MFA
  description: Every account holding an administrative role must have at least one MFA method registered
  severity: high
  framework: cis-m365
  effort: moderate
  exposure: internet
  remediation_group: m365_mfa_registration
  remediation_action: Drive MFA registration for all administrator accounts
  remediation_hint: 'Entra admin center > Protection > Authentication methods > User registration details:
    filter by admins'
  provider_check_ref:
    m365: graph:/reports/authenticationMethods/userRegistrationDetails
  framework_mappings:
    soc2: [CC6.1, CC6.2]
    nist: [IA-2(1)]
    iso27001: [A.8.5]
- code: CIS-M365-5.2.3.2
  name: Tenant-wide MFA registration coverage meets threshold
  description: At least 95% of users should have an MFA method registered - unregistered users cannot
    be protected by MFA policies
  severity: medium
  framework: cis-m365
  effort: refactor
  exposure: internet
  remediation_group: m365_mfa_registration
  remediation_action: Run an MFA registration campaign for remaining users
  remediation_hint: 'Entra admin center > Protection > Authentication methods > Registration campaign'
  provider_check_ref:
    m365: graph:/reports/authenticationMethods/userRegistrationDetails
  framework_mappings:
    soc2: [CC6.1, CC6.2]
    nist: [IA-2]
    iso27001: [A.8.5]
- code: CIS-M365-5.2.3.3
  name: SMS and voice authentication methods are disabled
  description: SMS and voice-call MFA are vulnerable to SIM-swapping and should be replaced by authenticator
    apps or phishing-resistant methods
  severity: medium
  framework: cis-m365
  effort: moderate
  exposure: internet
  remediation_group: m365_mfa_registration
  remediation_action: Disable SMS and voice authentication methods in the authentication methods policy
  remediation_hint: 'Entra admin center > Protection > Authentication methods > Policies: disable SMS
    and Voice call'
  provider_check_ref:
    m365: graph:/policies/authenticationMethodsPolicy
  framework_mappings:
    soc2: [CC6.1]
    nist: [IA-2(1)]
    iso27001: [A.8.5]

# ── §6 Exchange admin center ──────────────────────────────────────────
- code: CIS-M365-6.1.1
  name: Mailbox auditing is enabled organization-wide
  description: Organization-wide mailbox auditing must not be disabled - it records mailbox access, sends,
    and permission changes
  severity: high
  framework: cis-m365
  effort: quick
  exposure: internal
  remediation_group: m365_enable_auditing
  remediation_action: Enable organization-wide mailbox auditing
  remediation_hint: 'Set-OrganizationConfig -AuditDisabled $false'
  provider_check_ref:
    m365: exo:Get-OrganizationConfig(AuditDisabled)
  framework_mappings:
    soc2: [CC7.2]
    nist: [AU-2, AU-12]
    iso27001: [A.8.15]
- code: CIS-M365-6.2.1
  name: External mail forwarding is blocked
  description: Automatic forwarding to external domains is a classic exfiltration channel and must be
    blocked in outbound spam policy and transport rules
  severity: high
  framework: cis-m365
  effort: quick
  exposure: internet
  remediation_group: m365_exchange_forwarding
  remediation_action: Set outbound spam policy AutoForwardingMode to Off and remove forwarding transport
    rules
  remediation_hint: 'Set-HostedOutboundSpamFilterPolicy -Identity Default -AutoForwardingMode Off'
  provider_check_ref:
    m365: exo:Get-HostedOutboundSpamFilterPolicy,Get-TransportRule
  framework_mappings:
    soc2: [CC6.7]
    nist: [AC-4, SC-7]
    iso27001: [A.5.14, A.8.12]
- code: CIS-M365-6.2.2
  name: Transport rules do not whitelist sender domains
  description: Transport rules that set SCL to -1 for sender domains bypass all spam and phishing filtering
    and are frequently abused
  severity: medium
  framework: cis-m365
  effort: quick
  exposure: internet
  remediation_group: m365_exchange_forwarding
  remediation_action: Remove transport rules that bypass spam filtering for entire domains
  remediation_hint: 'Review Get-TransportRule output for SetSCL -1 rules and remove them'
  provider_check_ref:
    m365: exo:Get-TransportRule(SetSCL)
  framework_mappings:
    soc2: [CC6.8]
    nist: [SI-8]
    iso27001: [A.8.7]
- code: CIS-M365-6.3.1
  name: Default remote domain does not allow auto-forwarding
  description: The default (*) remote domain should have automatic forwarding disabled as a backstop against
    mailbox-rule exfiltration
  severity: medium
  framework: cis-m365
  effort: quick
  exposure: internet
  remediation_group: m365_exchange_forwarding
  remediation_action: Disable auto-forwarding on the default remote domain
  remediation_hint: 'Set-RemoteDomain -Identity Default -AutoForwardEnabled $false'
  provider_check_ref:
    m365: exo:Get-RemoteDomain(AutoForwardEnabled)
  framework_mappings:
    soc2: [CC6.7]
    nist: [AC-4, SC-7]
    iso27001: [A.5.14, A.8.12]
- code: CIS-M365-6.4.1
  name: Anonymous external calendar sharing is disabled
  description: Sharing policies should not allow anonymous users to view calendar details, which leak
    org structure and travel patterns
  severity: low
  framework: cis-m365
  effort: quick
  exposure: internet
  remediation_group: m365_exchange_sharing
  remediation_action: Remove anonymous calendar sharing from Exchange sharing policies
  remediation_hint: 'Set-SharingPolicy -Identity <policy> -Domains (list without Anonymous:Calendar entries)'
  provider_check_ref:
    m365: exo:Get-SharingPolicy(Domains)
  framework_mappings:
    soc2: [CC6.7]
    nist: [AC-3]
    iso27001: [A.5.14]
- code: CIS-M365-6.5.1
  name: Modern authentication for Exchange Online is enabled
  description: OAuth2 (modern authentication) must be enabled so clients authenticate with tokens and
    Conditional Access applies to Exchange
  severity: high
  framework: cis-m365
  effort: quick
  exposure: internet
  remediation_group: m365_exchange_hardening
  remediation_action: Enable modern authentication for Exchange Online
  remediation_hint: 'Set-OrganizationConfig -OAuth2ClientProfileEnabled $true'
  provider_check_ref:
    m365: exo:Get-OrganizationConfig(OAuth2ClientProfileEnabled)
  framework_mappings:
    soc2: [CC6.1, CC6.6]
    nist: [IA-2, AC-17]
    iso27001: [A.8.5, A.8.20]
- code: CIS-M365-6.5.2
  name: MailTips are enabled including external-recipient warnings
  description: MailTips warn users before mailing external recipients or large audiences, reducing accidental
    data disclosure
  severity: low
  framework: cis-m365
  effort: quick
  exposure: internal
  remediation_group: m365_exchange_hardening
  remediation_action: Enable all MailTips including external recipient tips
  remediation_hint: 'Set-OrganizationConfig -MailTipsAllTipsEnabled $true -MailTipsExternalRecipientsTipsEnabled
    $true'
  provider_check_ref:
    m365: exo:Get-OrganizationConfig(MailTips)
  framework_mappings:
    soc2: [CC6.7]
    nist: [AC-4]
    iso27001: [A.5.14]
- code: CIS-M365-6.5.3
  name: Third-party storage providers are disabled in Outlook on the web
  description: OWA should not offer third-party storage providers (Dropbox, Box, etc.) as attachment sources,
    keeping data inside sanctioned storage
  severity: medium
  framework: cis-m365
  effort: quick
  exposure: internal
  remediation_group: m365_exchange_hardening
  remediation_action: Disable additional storage providers in OWA mailbox policies
  remediation_hint: 'Set-OwaMailboxPolicy -Identity OwaMailboxPolicy-Default -AdditionalStorageProvidersAvailable
    $false'
  provider_check_ref:
    m365: exo:Get-OwaMailboxPolicy(AdditionalStorageProvidersAvailable)
  framework_mappings:
    soc2: [CC6.7]
    nist: [AC-20, SC-7]
    iso27001: [A.5.14, A.8.12]

# ── §7 SharePoint admin center ────────────────────────────────────────
