  framework_mappings:
    soc2: [CC6.7]
    nist: [SC-8]
    iso27001: [A.5.14, A.8.26]
- code: CIS-M365-2.1.11
  name: Connection filter has no IP allow list
  description: The connection filter policy should not whitelist sender IP ranges, which bypass all spam
    and phishing filtering
  severity: medium
  framework: cis-m365
  effort: quick
  exposure: internet
  remediation_group: m365_defender_email_policies
  remediation_action: Remove IP addresses from the connection filter allow list
  remediation_hint: 'Set-HostedConnectionFilterPolicy -Identity Default -IPAllowList @{}'
