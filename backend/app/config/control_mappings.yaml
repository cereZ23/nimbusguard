# ── CIS Microsoft 365 Foundations Benchmark (framework: cis-m365) ─────
# Codes mirror the benchmark's section numbering: CIS-M365-<section>.<sub>.<n>
# §1 Admin center, §2 Defender, §3 Purview, §5 Entra, §6 Exchange,
# §7 SharePoint, §8 Teams, §9 Fabric.
# automation: manual — no app-only API exists; catalogued but never evaluated.

# ── §1 Microsoft 365 admin center ─────────────────────────────────────
- code: CIS-M365-1.1.1
  name: Between two and four Global Administrators are designated
  description: The tenant should have at least two Global Administrator accounts for redundancy but no
    more than four to limit the attack surface of the most privileged role
  severity: high
  framework: cis-m365
  effort: moderate
  exposure: internal
  remediation_group: m365_limit_global_admins
  remediation_action: Reduce Global Administrator role membership to 2-4 accounts using least-privileged
    alternatives such as scoped admin roles
  remediation_hint: 'Entra admin center > Roles & admins > Global Administrator: review and remove excess
    members'
  provider_check_ref:
    m365: graph:/directoryRoles?$expand=members
  framework_mappings:
    soc2: [CC6.1, CC6.3]
    nist: [AC-2, AC-6]
    iso27001: [A.5.15, A.8.2]
- code: CIS-M365-1.1.4
  name: Disabled accounts do not hold privileged roles
  description: Accounts that are disabled should be removed from all privileged directory roles to prevent
    reactivation abuse
  severity: medium
  framework: cis-m365
  effort: quick
  exposure: internal
  remediation_group: m365_limit_global_admins
  remediation_action: Remove disabled accounts from all privileged directory roles
  remediation_hint: 'Entra admin center > Roles & admins: audit each privileged role and remove disabled
    members'
  provider_check_ref:
    m365: graph:/directoryRoles?$expand=members
  framework_mappings:
    soc2: [CC6.1, CC6.3]
    nist: [AC-2]
    iso27001: [A.5.16, A.5.18]

# ── §2 Microsoft Defender for Office 365 ──────────────────────────────
- code: CIS-M365-2.1.1
  name: Safe Links policy is enabled for email
  description: Microsoft Defender Safe Links should scan URLs at click time in email (and ideally Teams
    and Office clients) to protect against weaponized links
  severity: high
  framework: cis-m365
  effort: quick
  exposure: internet
  remediation_group: m365_defender_email_policies
  remediation_action: Enable a Defender for Office 365 Safe Links policy covering all recipients
  remediation_hint: 'Defender portal > Policies & rules > Threat policies > Safe Links; or PowerShell:
    New-SafeLinksPolicy'
  provider_check_ref:
    m365: exo:Get-SafeLinksPolicy
  framework_mappings:
    soc2: [CC6.8]
    nist: [SI-3, SI-8]
    iso27001: [A.8.7]
- code: CIS-M365-2.1.2
  name: Common attachment types filter is enabled
  description: The anti-malware common attachment types filter should block executable and script attachments
    outright
  severity: high
  framework: cis-m365
  effort: quick
  exposure: internet
  remediation_group: m365_defender_email_policies
  remediation_action: Enable the common attachment types filter in the anti-malware policy
  remediation_hint: 'Set-MalwareFilterPolicy -Identity Default -EnableFileFilter $true'
  provider_check_ref:
    m365: exo:Get-MalwareFilterPolicy(EnableFileFilter)
  framework_mappings:
    soc2: [CC6.8]
    nist: [SI-3]
    iso27001: [A.8.7]
