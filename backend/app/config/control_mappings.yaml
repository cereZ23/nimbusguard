  framework_mappings:
    soc2: [CC6.8]
    nist: [SI-3]
    iso27001: [A.8.7]
- code: CIS-M365-2.1.6
  name: Outbound spam notifications are configured
  description: Outbound spam policies should notify administrators (or BCC suspicious mail) so compromised
