name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/cerez23/nimbusguard

jobs:
  # ── Backend: lint + test + coverage ────────────────────────────
  backend-test:
    name: Backend — test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cspm
          POSTGRES_PASSWORD: cspm
          POSTGRES_DB: cspm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql+asyncpg://cspm:cspm@localhost:5432/cspm_test"
      REDIS_URL: "redis://localhost:6379/0"
      DEBUG: "true"
      SECRET_KEY: "ci-test-secret-key-not-for-production"
      # SECURITY: Never use a hardcoded fallback for the encryption key.
      # The CI secret must be set in GitHub Actions settings. If missing,
      # the test conftest.py generates a throwaway Fernet key at runtime.
      CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CI_ENCRYPTION_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('backend/pyproject.toml') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Install uv
        run: pip install uv --quiet

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Lint — ruff check
        run: ruff check app/ tests/

      - name: Lint — ruff format check
        run: ruff format --check app/ tests/

      - name: Run tests with coverage
        run: |
          pytest --tb=short -q \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=55 \
            --durations=20

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  # ── Frontend: lint + typecheck + test + build ──────────────────
  frontend-test:
    name: Frontend — test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v4
        with:
          version: "9.15.4"

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: pnpm test:unit

      - name: Build
        run: pnpm build

  # ── Security Scan ──────────────────────────────────────────────
  security-scan:
    name: Security — scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install security tools
        run: pip install bandit semgrep --quiet

      - name: Bandit security scan
        run: bandit -r backend/app/ -f json -o bandit-report.json -ll --exit-zero

      - name: Semgrep scan
        run: |
          semgrep scan \
            --config=p/python \
            --config=p/javascript \
            --config=p/owasp-top-ten \
            --sarif -o semgrep-report.sarif \
            --exclude='tests/' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            backend/app/ frontend/src/ \
            || true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            semgrep-report.sarif

  # ── Docker Build + Push to GHCR ───────────────────────────────
  build-images:
    name: Docker — build & push
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/backend:latest
            ${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/frontend:latest
            ${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }}"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          trivyignores: ".trivyignore"

  # ── Deploy to Production ───────────────────────────────────────
  deploy:
    name: Deploy — production
    runs-on: ubuntu-latest
    needs: [build-images]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 146.190.178.108
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/cspm

            # Pull latest code
            git fetch origin main --depth=1
            git reset --hard origin/main

            # Add localhost port mappings for Caddy
            python3 -c "
            import yaml
            with open('docker-compose.prod.yml') as f:
                c = yaml.safe_load(f)
            for svc, port in [('cspm-backend','127.0.0.1:8001:8000'),('cspm-frontend','127.0.0.1:3001:3000')]:
                for k,v in c['services'].items():
                    if v.get('container_name')==svc:
                        v.setdefault('ports',[])
                        if port not in v['ports']:
                            v['ports'].append(port)
            with open('docker-compose.prod.yml','w') as f:
                yaml.dump(c,f,default_flow_style=False,sort_keys=False)
            "

            # Pull pre-built GHCR images (scanned by Trivy in CI) and restart
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker pull ghcr.io/cerez23/nimbusguard/backend:latest || true
            docker pull ghcr.io/cerez23/nimbusguard/frontend:latest || true
            docker compose -f docker-compose.prod.yml up -d --build

            # Wait for health
            echo "Waiting for backend..."
            for i in $(seq 1 30); do
              if curl -sf http://127.0.0.1:8001/health > /dev/null 2>&1; then
                echo "Backend healthy!"
                break
              fi
              sleep 5
            done

      - name: Smoke test
        run: |
          sleep 10
          HTTP_CODE=$(curl -skL -o /dev/null -w "%{http_code}" --connect-timeout 10 "https://cspm.securekt.com/health" 2>/dev/null || echo "000")
          echo "Health check: HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Health check returned $HTTP_CODE — deploy may have failed"
            exit 1
          fi

          HTTP_CODE=$(curl -skL -o /dev/null -w "%{http_code}" --connect-timeout 10 "https://cspm.securekt.com/" 2>/dev/null || echo "000")
          echo "Frontend check: HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "307" ]; then
            echo "::error::Frontend returned $HTTP_CODE"
            exit 1
          fi
          echo "Smoke tests passed."

  # ── Pipeline Summary ───────────────────────────────────────────
  pipeline-summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, security-scan, build-images]
    if: always()

    steps:
      - name: Pipeline results
        run: |
          echo "## Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Tests | ${{ needs.backend-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Tests | ${{ needs.frontend-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Push Images | ${{ needs.build-images.result }} |" >> $GITHUB_STEP_SUMMARY
